<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    >
    <title>Pocket Manager — Football Club</title>
    <meta name="description" content="A pocket football manager game inspired by Elifoot. Build your squad, set tactics, win the league.">
    <meta name="theme-color" content="#0c1f17">

    <!-- iOS home-screen / standalone app hints -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pocket Manager">
    <link rel="apple-touch-icon" href="icon-180.png">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.webmanifest">

    <link rel="stylesheet" href="game.css">
  </head>
  <body>
    <div class="app" id="app">
      <!-- Top status bar -->
      <header class="topbar" id="topbar" hidden>
        <div class="topbar__club">
          <span class="topbar__badge" id="club-badge"></span>
          <span class="topbar__name" id="club-name"></span>
        </div>
        <div class="topbar__stats">
          <span class="stat" title="Budget"><b id="club-budget">—</b></span>
          <span class="stat" title="League position">#<b id="club-position">—</b></span>
        </div>
      </header>

      <!-- Main view (screens render here) -->
      <main class="screen" id="screen"></main>

      <!-- Bottom navigation -->
      <nav class="tabbar" id="tabbar" hidden>
        <button class="tab" data-tab="squad" type="button"><span class="tab__ico">⚽</span><span>Squad</span></button>
        <button class="tab" data-tab="tactics" type="button"><span class="tab__ico">▦</span><span>Tactics</span></button>
        <button class="tab" data-tab="match" type="button"><span class="tab__ico">▶</span><span>Match</span></button>
        <button class="tab" data-tab="transfers" type="button"><span class="tab__ico">⇄</span><span>Market</span></button>
        <button class="tab" data-tab="league" type="button"><span class="tab__ico">≣</span><span>League</span></button>
      </nav>
    </div>

    <script src="game.js"></script>
  </body>
</html>
